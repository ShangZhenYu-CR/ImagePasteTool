name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "source_parts/**"
      - "tools/assemble_source.py"
      - "requirements.txt"
      - "build_windows_exe.bat"
      - ".github/workflows/build-windows.yml"

# Source is stored in validated chunks so the connector can maintain it safely.
# tools/assemble_source.py rebuilds the single .pyw before PyInstaller runs.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Assemble source
        run: python tools/assemble_source.py

      - name: Build EXE
        shell: cmd
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ImagePasteTool
          --collect-all pystray
          --collect-all pywinauto
          --hidden-import pystray._win32
          --hidden-import PIL.ImageTk
          image_paste_v2_3_6.pyw

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ImagePasteTool-Windows
          path: dist/ImagePasteTool.exe
